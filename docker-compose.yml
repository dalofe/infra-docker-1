services:
  # 1. Our Database service
  db-postgres:
    image: postgres:16-alpine
    container_name: my_database_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Our Backend service
  api-backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    container_name: my_backend_node
    depends_on:
      db-postgres:
        condition: service_healthy
    environment:
      - DB_HOST=db-postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL=false

  # 3. Our Frontend service
  web-frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3000
    ports:
      - "8080:80"
    container_name: my_frontend_react
    depends_on:
      - api-backend
      
# The declaration of our permanent storage
volumes:
  postgres_data: